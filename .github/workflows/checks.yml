name: Frontend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Scan published files for credentials
        run: >-
          docker run --rm --network none --read-only
          -v "$PWD/dist:/scan:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          dir /scan --redact=100 --no-banner
